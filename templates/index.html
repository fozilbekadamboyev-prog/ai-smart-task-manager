<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Task Manager</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .priority-High { color: #dc3545; font-weight: bold; }
        .priority-Medium { color: #ffc107; font-weight: bold; }
        .priority-Low { color: #198754; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 mb-4">
                    <h2 class="text-center mb-4">🧠 AI Smart Task Manager</h2>
                    <div class="input-group mb-3">
                        <input type="text" id="taskInput" class="form-control-lg form-control" placeholder="Yangi vazifa yozing (Masalan: Bugun soat 5 da shoshilinch uchrashuv bor)...">
                        <button class="btn btn-primary btn-lg" type="button" id="addButton">Qo'shish</button>
                    </div>
                </div>

                <div class="card p-4">
                    <h4>📋 Vazifalar ro'yxati</h4>
                    <div id="taskList" class="list-group mt-3">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadTasks);
        document.getElementById('addButton').addEventListener('click', addTask);

        async function loadTasks() {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            tasks.forEach(task => {
                const item = document.createElement('div');
                item.className = 'list-group-item d-flex justify-content-between align-items-center';
                item.innerHTML = `
                    <span>${task.title}</span>
                    <span class="badge bg-light priority-${task.priority.split(' ')}">${task.priority}</span>
                `;
                list.appendChild(item);
            });
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;

            await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: input.value })
            });

            input.value = '';
            loadTasks();
        }
    </script>
</body>
</html>
